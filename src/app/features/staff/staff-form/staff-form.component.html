<div class="staff-form">
  <header class="form-header">
    <button type="button" (click)="cancel()" class="back-btn" aria-label="Retour au personnel">
      <svg lucideArrowLeft [size]="16"></svg>
    </button>
    <div>
      <h1>Nouveau membre</h1>
      <p>Ajouter un membre au personnel</p>
    </div>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" class="dc-card">
    <div class="form-grid">
      <div class="form-field">
        <label class="form-label">Prénom <span class="required">*</span></label>
        <input formControlName="firstName" class="dc-input" autocomplete="given-name" />
      </div>
      <div class="form-field">
        <label class="form-label">Nom <span class="required">*</span></label>
        <input formControlName="lastName" class="dc-input" autocomplete="family-name" />
      </div>
      <div class="form-field">
        <label class="form-label">Email <span class="required">*</span></label>
        <input type="email" formControlName="email" class="dc-input" autocomplete="email" />
      </div>
      <div class="form-field">
        <label class="form-label">Téléphone</label>
        <input type="tel" formControlName="phone" class="dc-input" autocomplete="tel" />
      </div>
      <div class="form-field">
        <label class="form-label">Rôle <span class="required">*</span></label>
        <select formControlName="role" class="dc-input">
          @for (role of roles; track role.value) {
            <option [value]="role.value">{{ role.label }}</option>
          }
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">Spécialité</label>
        <input formControlName="specialty" class="dc-input" placeholder="Chirurgien-dentiste..." />
      </div>
    </div>

    @if (error()) {
      <div class="error-banner" role="alert"><svg lucideX [size]="16"></svg>{{ error() }}</div>
    }

    <div class="form-actions">
      <button type="button" (click)="cancel()" class="dc-btn-secondary">Annuler</button>
      <button type="submit" [disabled]="saving()" class="dc-btn-primary">
        @if (saving()) { <span class="spinner-sm"></span> }
        <svg lucideSave [size]="14"></svg>
        Créer le membre
      </button>
    </div>
  </form>
</div>
