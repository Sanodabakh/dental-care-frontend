<div class="table-wrap">
  <table class="dc-table">
    <thead>
      <tr>
        @for (column of columns(); track column.key) {
          <th>{{ column.label }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track $index) {
        <tr>
          @for (column of columns(); track column.key) {
            <td>{{ row[column.key] ?? '—' }}</td>
          }
        </tr>
      } @empty {
        <tr><td class="empty-search" [attr.colspan]="columns().length">{{ emptyMessage() }}</td></tr>
      }
    </tbody>
  </table>
</div>
